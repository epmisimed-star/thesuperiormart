<!--
  BLOGGER SHOP PRO — storefront + admin dashboard (একটাই ফাইল)
  Blogger: Pages > New page > HTML view > পুরো ফাইল paste করুন > Publish
-->
<div id="bsShop"></div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hind+Siliguri:wght@400;500;600&display=swap');

#bsShop{--ink:#14211f;--muted:#5a6b68;--paper:#f4f7f6;--card:#fff;--line:#dde6e4;--brand:#0b6a5a;--brand-d:#073f36;--brand-l:#e2f1ee;--sale:#c2410c;--warn:#b42318;--ok:#157347;--gold:#f2b84b;
  font-family:'Hind Siliguri',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px;
  max-width:1200px;margin:0 auto;border-radius:14px;overflow:clip;position:relative;box-sizing:border-box;text-align:left}
#bsShop *{box-sizing:border-box}
#bsShop h1,#bsShop h2,#bsShop h3{font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;margin:0;line-height:1.2;color:var(--ink);letter-spacing:-.01em}
#bsShop p{margin:0}
#bsShop button,#bsShop input,#bsShop select,#bsShop textarea{font:inherit;color:inherit}
#bsShop button{cursor:pointer}
#bsShop a{color:var(--brand)}
#bsShop :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#bsShop svg{flex:none}

/* buttons & fields */
#bsShop .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:9px 18px;border-radius:8px;font-weight:600;text-decoration:none;transition:background .15s,border-color .15s}
#bsShop .btn:hover{background:var(--brand-d);border-color:var(--brand-d)}
#bsShop .btn.ghost{background:transparent;color:var(--brand)}
#bsShop .btn.ghost:hover{background:var(--brand-l)}
#bsShop .btn.gold{background:var(--gold);border-color:var(--gold);color:#1b2a28}
#bsShop .btn.gold:hover{background:#e8a92f;border-color:#e8a92f}
#bsShop .btn.danger{background:transparent;border-color:#e2b4af;color:var(--warn)}
#bsShop .btn.danger:hover{background:#fdeceb}
#bsShop .btn.danger-solid{background:var(--warn);border-color:var(--warn)}
#bsShop .btn.small{padding:5px 11px;font-size:14px}
#bsShop .btn.block{width:100%}
#bsShop .btn[disabled]{opacity:.5;cursor:not-allowed}
#bsShop .fld{display:block;margin-bottom:12px}
#bsShop .fld>span{display:block;font-size:14px;color:var(--muted);margin-bottom:3px}
#bsShop .fld input,#bsShop .fld select,#bsShop .fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
#bsShop .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#bsShop .hint{font-size:13px;color:var(--muted)}
#bsShop .xbtn{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--paper);display:flex;align-items:center;justify-content:center}
#bsShop .xbtn:hover{background:var(--line)}

/* header */
#bsShop .ann{background:var(--brand-d);color:#dcefeb;text-align:center;font-size:14px;padding:7px 14px}
#bsShop .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 24px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
#bsShop .brand{font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;font-weight:700;font-size:24px;color:var(--brand-d);margin-right:auto}
#bsShop .sbox{position:relative;flex:0 1 340px;width:100%}
#bsShop .sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
#bsShop .sbox input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--line);border-radius:99px;background:var(--paper)}
#bsShop .cartbtn b{background:var(--gold);color:#1b2a28;border-radius:99px;font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px}

/* hero */
#bsShop .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;background:var(--brand-d);padding:48px 32px}
#bsShop .hero h1{color:#fff;font-size:clamp(30px,4.6vw,50px);max-width:15ch}
#bsShop .hero p{color:#c9e0db;font-size:18px;max-width:46ch;margin:14px 0 24px}
#bsShop .mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:340px}
#bsShop .mosaic .m{border-radius:12px;overflow:hidden;background:#0f5347}
#bsShop .mosaic .m:first-child{grid-row:span 2}
#bsShop .mosaic img{width:100%;height:100%;object-fit:cover;display:block}
#bsShop .mosaic .ph{font-size:48px}
#bsShop .perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));background:#fff;border-bottom:1px solid var(--line)}
#bsShop .perk{display:flex;gap:12px;align-items:center;padding:16px 24px}
#bsShop .perk svg{color:var(--brand)}
#bsShop .perk b{display:block;font-weight:600;line-height:1.3}
#bsShop .perk span{color:var(--muted);font-size:13px}

/* catalogue */
#bsShop .sec{padding:34px 24px 20px}
#bsShop .sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
#bsShop .sechead h2{font-size:28px}
#bsShop .tools{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
#bsShop .tools select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
#bsShop .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
#bsShop .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 15px;font-size:14px}
#bsShop .chip:hover{border-color:var(--brand)}
#bsShop .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
#bsShop .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px}
#bsShop .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
#bsShop .pcard:hover{border-color:#b7cdc8;box-shadow:0 6px 18px rgba(7,63,54,.09)}
#bsShop .pimg{position:relative;aspect-ratio:1/1;background:#e9efee;cursor:pointer;overflow:hidden}
#bsShop .pimg img{width:100%;height:100%;object-fit:cover;display:block}
#bsShop .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:700 64px 'Bricolage Grotesque',sans-serif}
#bsShop .badge{position:absolute;top:10px;left:10px;background:var(--sale);color:#fff;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
#bsShop .soldout{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--warn)}
#bsShop .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
#bsShop .pcat{font-size:13px;color:var(--muted)}
#bsShop .pname{font-weight:600;cursor:pointer;line-height:1.35}
#bsShop .pname:hover{color:var(--brand)}
#bsShop .price{font-weight:600;font-size:18px;color:var(--brand-d);margin:4px 0 8px;flex:1;display:flex;align-items:flex-end;flex-wrap:wrap;gap:0 8px}
#bsShop .price s{color:var(--muted);font-weight:400;font-size:14px}
#bsShop .price.big{font-size:26px}
#bsShop .empty{grid-column:1/-1;padding:40px 0;color:var(--muted)}

/* footer */
#bsShop .foot{background:var(--ink);color:#b9c9c6;margin-top:20px;padding:34px 24px 16px}
#bsShop .fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
#bsShop .foot h3{color:#fff;font-size:17px;margin-bottom:10px}
#bsShop .foot a{color:#d8ebe7}
#bsShop .foot li{margin-bottom:5px;list-style:none}
#bsShop .foot ul{padding:0;margin:0}
#bsShop .copy{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #2c3d3a;margin-top:24px;padding-top:14px;font-size:14px}
#bsShop .copy button{background:none;border:0;color:#8fa5a1;text-decoration:underline;padding:0}

/* modal / drawer */
#bsShop .modal{position:fixed;inset:0;background:rgba(8,22,20,.55);z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
#bsShop .modal[hidden]{display:none}
#bsShop .sheet{position:relative;background:#fff;border-radius:14px;width:100%;max-width:520px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
#bsShop .modal.wide .sheet{max-width:780px}
#bsShop .modal.drawer{padding:0;justify-content:flex-end;align-items:stretch}
#bsShop .modal.drawer .sheet{max-width:430px;border-radius:0;min-height:100%}
#bsShop .sheet h2{font-size:22px;margin:0 36px 14px 0}
#bsShop .sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#bsShop .li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
#bsShop .li .th{width:54px;height:54px;border-radius:8px;overflow:hidden;background:#e9efee;flex:none}
#bsShop .li .th img{width:100%;height:100%;object-fit:cover;display:block}
#bsShop .li .th .ph{font-size:22px}
#bsShop .li .t{flex:1;min-width:0}
#bsShop .li .t small{display:block;color:var(--muted)}
#bsShop .qty{display:inline-flex;align-items:center;gap:10px}
#bsShop .qty button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1}
#bsShop .qty button:hover{background:var(--brand-l)}
#bsShop .sum{padding:12px 0;font-size:15px}
#bsShop .sum div{display:flex;justify-content:space-between;padding:3px 0}
#bsShop .sum .tot{font-weight:600;font-size:19px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
#bsShop .prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 4px}
#bsShop .prog i{display:block;height:100%;background:var(--brand)}
#bsShop .opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px;cursor:pointer}
#bsShop .opt input{width:auto;margin:0}
#bsShop .opt span{flex:1}
#bsShop .note{background:var(--brand-l);border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:12px}
#bsShop .qv{display:grid;grid-template-columns:1fr 1fr;gap:24px}
#bsShop .qvimg{border-radius:12px;overflow:hidden;background:#e9efee;aspect-ratio:1/1}
#bsShop .qvimg img{width:100%;height:100%;object-fit:cover;display:block}
#bsShop .qv h2{margin:4px 0 8px}
#bsShop .qv p{color:var(--muted);margin-bottom:12px}
#bsShop .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;z-index:100000;font-size:15px;max-width:90vw}
#bsShop .toast[hidden]{display:none}

/* admin */
#bsShop .adm{display:grid;grid-template-columns:236px 1fr;min-height:700px;background:#eef3f2}
#bsShop .side{background:#082b25;color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
#bsShop .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;font-weight:700;font-size:17px;line-height:1.2}
#bsShop .logo i{width:36px;height:36px;border-radius:10px;background:var(--gold);color:#1b2a28;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px;flex:none}
#bsShop .logo small{display:block;font-family:'Hind Siliguri',sans-serif;font-weight:400;font-size:12px;color:#8db3ab}
#bsShop .side button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#c4ddd8;text-align:left;padding:10px 12px;border-radius:9px;width:100%}
#bsShop .side button:hover{background:rgba(255,255,255,.08)}
#bsShop .side button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
#bsShop .side .cnt{margin-left:auto;background:rgba(255,255,255,.16);border-radius:99px;font-size:12px;padding:0 8px;line-height:20px}
#bsShop .side .sp{flex:1}
#bsShop .side .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 6px}
#bsShop .main{padding:0;min-width:0}
#bsShop .mhead{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding:18px 26px;background:#fff;border-bottom:1px solid var(--line)}
#bsShop .mhead h2{font-size:24px}
#bsShop .mhead p{color:var(--muted);font-size:14px}
#bsShop .mact{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#bsShop .pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:4px 12px;border-radius:99px;background:#e2f3ea;color:var(--ok)}
#bsShop .pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
#bsShop .pill.warn{background:#fff1d6;color:#a35a00}
#bsShop .abody{padding:24px 26px 30px}

#bsShop .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:16px}
#bsShop .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center}
#bsShop .kpi .ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--brand-l);color:var(--brand);flex:none}
#bsShop .kpi .ic.amber{background:#fff1d6;color:#a35a00}
#bsShop .kpi .ic.red{background:#fde2df;color:var(--warn)}
#bsShop .kpi .ic.blue{background:#e3ecfb;color:#2b56a8}
#bsShop .kpi b{display:block;font:700 24px 'Bricolage Grotesque',sans-serif;line-height:1.1}
#bsShop .kpi span{color:var(--muted);font-size:14px}
#bsShop .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
#bsShop .card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#bsShop .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
#bsShop .donut{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
#bsShop .legend{list-style:none;margin:0;padding:0;flex:1;min-width:150px}
#bsShop .legend li{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:15px}
#bsShop .legend i{width:11px;height:11px;border-radius:3px;flex:none}
#bsShop .legend b{margin-left:auto}
#bsShop .bars{display:flex;flex-direction:column;gap:13px}
#bsShop .bars .r>div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
#bsShop .bars .r>div:first-child span:last-child{color:var(--muted)}
#bsShop .bars .t{height:8px;background:#e5ecea;border-radius:9px;overflow:hidden}
#bsShop .bars .t i{display:block;height:100%;background:var(--brand);border-radius:9px}
#bsShop .meter{height:8px;background:#e5ecea;border-radius:9px;overflow:hidden;margin:6px 0 10px}
#bsShop .meter i{display:block;height:100%;background:var(--brand);border-radius:9px}

#bsShop .tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
#bsShop .tb input[type=search],#bsShop .tb select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
#bsShop .tb .grow{flex:1;min-width:180px}
#bsShop .bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--brand-d);color:#fff;border-radius:10px;padding:9px 14px;margin-bottom:12px}
#bsShop .bulk .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
#bsShop .bulk .btn:hover{background:rgba(255,255,255,.24)}
#bsShop .bulk span{margin-right:auto}
#bsShop .tblw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
#bsShop .tbl{width:100%;border-collapse:collapse}
#bsShop .tbl th,#bsShop .tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
#bsShop .tbl tr:last-child td{border-bottom:0}
#bsShop .tbl th{background:#f3f7f6;font-size:14px;color:var(--muted);font-weight:500}
#bsShop .tbl tr.sel td{background:#eef7f5}
#bsShop .tbl input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
#bsShop .tbl s{color:var(--muted);font-size:13px;margin-left:6px}
#bsShop .ac{text-align:right}
#bsShop .pn{display:flex;align-items:center;gap:11px}
#bsShop .thumb{width:42px;height:42px;border-radius:8px;overflow:hidden;background:#e9efee;flex:none}
#bsShop .thumb img{width:100%;height:100%;object-fit:cover;display:block}
#bsShop .thumb .ph{font-size:18px}
#bsShop .stk{width:80px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
#bsShop .tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--brand-l);color:var(--brand-d);display:inline-block}
#bsShop .tag.low{background:#fdebd3;color:var(--sale)}
#bsShop .tag.out{background:#fde2df;color:var(--warn)}
#bsShop .ibtn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
#bsShop .ibtn:hover{background:var(--brand-l);color:var(--brand)}
#bsShop .ibtn.d:hover{background:#fdeceb;color:var(--warn)}
#bsShop .chk{list-style:none;padding:0;margin:0}
#bsShop .chk li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:15px}
#bsShop .chk .d{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
#bsShop .chk .d.y{background:var(--ok);border-color:var(--ok)}

#bsShop .setrow{display:grid;grid-template-columns:230px 1fr;gap:26px;padding:22px 0;border-bottom:1px solid var(--line)}
#bsShop .setrow:first-child{padding-top:0}
#bsShop .setrow h3{font-size:17px;margin-bottom:4px}
#bsShop .setrow p{color:var(--muted);font-size:14px}
#bsShop .setrow .fields{max-width:640px}
#bsShop .savebar{position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 26px;margin:0 -26px -30px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#bsShop .steps{counter-reset:s;list-style:none;padding:0;margin:0 0 14px}
#bsShop .steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:6px 0}
#bsShop .steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
#bsShop .dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
#bsShop .dstats div{background:var(--paper);border-radius:10px;padding:10px 12px}
#bsShop .dstats b{display:block;font:700 22px 'Bricolage Grotesque','Hind Siliguri',sans-serif}
#bsShop .dstats span{font-size:13px;color:var(--muted)}
#bsShop textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;height:200px;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafcfc}
#bsShop .bar{display:flex;gap:10px;margin:12px 0 0;flex-wrap:wrap;align-items:center}

@media(max-width:760px){
  #bsShop .grid2,#bsShop .setrow{grid-template-columns:1fr;gap:10px}
  #bsShop .dstats{grid-template-columns:1fr 1fr}
  #bsShop .mhead,#bsShop .abody{padding-left:14px;padding-right:14px}
  #bsShop .savebar{margin:0 -14px -30px;padding:12px 14px}
  #bsShop .logo,#bsShop .side .sep{display:none}
  #bsShop .side button{width:auto}
}

@media(max-width:760px){
  #bsShop .hero{grid-template-columns:1fr;padding:32px 20px}
  #bsShop .mosaic{height:240px}
  #bsShop .fgrid,#bsShop .qv,#bsShop .two{grid-template-columns:1fr}
  #bsShop .top{padding:10px 14px;flex-wrap:wrap}
  #bsShop .sbox{order:3;flex-basis:100%}
  #bsShop .sec{padding:26px 14px 14px}
  #bsShop .adm{grid-template-columns:1fr}
  #bsShop .side{flex-direction:row;flex-wrap:wrap;padding:10px}
  #bsShop .side .brand,#bsShop .side .sp{display:none}
  #bsShop .row{grid-template-columns:1fr}
  #bsShop .main{padding:16px}
  #bsShop .grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(prefers-reduced-motion:reduce){#bsShop *{transition:none!important}}
</style>

<script>
//<![CDATA[
(function () {
  /* ================================================================
     ১) PUBLISHED DATA — Admin > Publish ট্যাব থেকে যে কোড পাবেন,
        এই "var PUBLISHED = {...};" অংশটা সেটা দিয়ে replace করুন।
        তাহলেই সব visitor আপনার নতুন পণ্য/সেটিংস দেখতে পাবে।
     ================================================================ */
  var PUBLISHED = {
    settings: {

    var json = "var PUBLISHED = " + JSON.stringify(data, null, 1) + ";", kb = (json.length / 1024).toFixed(1), pct = Math.min(100, Math.round(json.length / 2000)), df = diffInfo();
    return '<div class="card" style="margin-bottom:16px"><h3>পরিবর্তনের সারসংক্ষেপ</h3><div class="dstats"><div><b>' + df.add + "</b><span>নতুন পণ্য</span></div><div><b>" + df.edit + "</b><span>পরিবর্তিত পণ্য</span></div><div><b>" + df.rem + "</b><span>মুছে ফেলা পণ্য</span></div><div><b>" + (df.set ? "হ্যাঁ" : "না") + "</b><span>Settings বদলেছে</span></div></div>" +
      (dirty() ? '<p class="hint">এই পরিবর্তনগুলো এখনো visitor-রা দেখছে না।</p>' : '<p class="hint">সব পরিবর্তন Published, নতুন কিছু নেই।</p>') + "</div>" +
      '<div class="card" style="margin-bottom:16px"><h3>Publish করুন</h3><ol class="steps"><li><span>নিচের কোড <b>Copy</b> করুন।</span></li><li><span>Blogger → Pages → shop page → <b>HTML view</b> খুলুন।</span></li><li><span><code>var PUBLISHED = {…};</code> অংশটা মুছে copy করা কোড বসান।</span></li><li><span><b>Update</b> চাপুন।</span></li></ol>' +
      '<textarea class="code" id="pubCode" readonly aria-label="Publish code">' + esc(json) + "</textarea>" +
      '<div class="meter"><i style="width:' + pct + '%"></i></div><p class="hint">কোডের সাইজ: ' + kb + " KB" + (json.length > 200000 ? " — বেশ বড়। সরাসরি upload করা ছবি বাদ দিয়ে image URL ব্যবহার করুন।" : "") + '</p>' +
      '<div class="bar"><button class="btn" data-act="copy">' + ico("copy", 16) + ' Copy code</button><button class="btn ghost" data-act="dlbackup">' + ico("download", 16) + ' Backup (.json)</button></div></div>' +
      '<div class="card"><h3>Restore ও Draft</h3><p class="hint" style="margin-bottom:8px">আগের Publish কোড বা backup এখানে paste করলে সব পণ্য ও settings ফিরে আসবে (অন্য device থেকে কাজ শুরু করতেও কাজে লাগে)।</p><textarea class="code" id="rest" style="height:110px" placeholder="var PUBLISHED = {...};" aria-label="Restore code"></textarea>' +
      '<div class="bar"><button class="btn ghost" data-act="restore">Restore করুন</button><button class="btn danger" data-act="reset">Draft মুছে ফেলুন</button></div></div>';
  }
  function renderAdmin() {
    var t = st.tab;
    app.innerHTML = adminShell(t === "products" ? tabProducts() : t === "categories" ? tabCategories() : t === "settings" ? tabSettings() : t === "publish" ? tabPublish() : tabOverview());
    if (t === "products") updProducts();
  }

  function productForm(p) {
    var n = !p; p = p || { name: "", category: "", price: "", oldPrice: "", stock: 10, image: "", desc: "", featured: false };
    openModal("<h2>" + (n ? "Add product" : "Edit product") + "</h2>" +
      F("fName", "নাম", p.name) +
      '<div class="row"><label class="fld"><span>Category</span><input id="fCat" list="bsCats" value="' + esc(p.category) + '"><datalist id="bsCats">' + cats().map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + "</datalist></label>" + F("fStock", "Stock", p.stock, "number", ' min="0"') + "</div>" +
      '<div class="row">' + F("fPrice", "দাম", p.price, "number", ' min="0"') + F("fOld", "আগের দাম (ঐচ্ছিক)", p.oldPrice || "", "number", ' min="0"') + "</div>" +
      F("fImg", "ছবির URL", p.image, "text", ' placeholder="https://blogger.googleusercontent.com/..."') +
      '<label class="fld"><span>অথবা ছবি বেছে নিন (ছোট করে save হবে)</span><input id="fFile" type="file" accept="image/*"></label>' +
      '<label class="fld"><span>বিবরণ</span><textarea id="fDesc" rows="3">' + esc(p.desc) + "</textarea></label>" +
      '<label class="opt"><input type="checkbox" id="fFeat"' + (p.featured ? " checked" : "") + "><span>Featured (হোমপেজে আগে ও hero-তে দেখাবে)</span></label>" +
      '<div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveprod" data-id="' + (n ? "" : p.id) + '">Save</button></div>');
    modal.querySelector("#fFile").onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var im = new Image();
        im.onload = function () {
          var k = Math.min(1, 500 / Math.max(im.width, im.height)), c = document.createElement("canvas");
          c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          modal.querySelector("#fImg").value = c.toDataURL("image/jpeg", 0.7);
          toast("ছবি প্রস্তুত");
        };
        im.src = r.result;
      };
      r.readAsDataURL(f);
    };
  }
  function saveProduct(id) {
    var g = function (k) { return modal.querySelector("#" + k).value.trim(); };
    var name = g("fName");
    if (!name || g("fPrice") === "" || num(g("fPrice")) < 0) { toast("নাম ও দাম দিন"); return; }
    var obj = { id: id || uid(), name: name, category: g("fCat") || "General", price: num(g("fPrice")), oldPrice: num(g("fOld")), stock: Math.max(0, parseInt(g("fStock"), 10) || 0), image: g("fImg"), desc: g("fDesc"), featured: modal.querySelector("#fFeat").checked };
    var i = data.products.map(function (p) { return p.id; }).indexOf(obj.id);
    if (i >= 0) data.products[i] = obj; else data.products.unshift(obj);
    saveDraft(); closeModal(); renderAdmin(); toast("Saved");
  }
  function saveSettings() {
    var v = function (k) { return root.querySelector("#" + k).value.trim(); };
    if (!v("sPass")) { toast("Password খালি রাখা যাবে না"); return; }
    data.settings = {
      storeName: v("sName") || "My Shop", tagline: v("sTag"), announcement: v("sAnn"), heroTitle: v("sHT"), heroText: v("sHX"),
      whatsapp: v("sWa"), phone: v("sPh"), email: v("sEm"), facebook: v("sFb"), address: v("sAd"),
      currency: v("sCur") || "৳", freeAbove: num(v("sFree")), deliveryIn: num(v("sDi")), deliveryOut: num(v("sDo")), bkash: v("sBk"), nagad: v("sNg"), adminPass: v("sPass")
    };
    saveDraft(); renderAdmin(); toast("Saved — Publish করতে ভুলবেন না");
  }
  function downloadFile(name, text, type) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
  function exportCsv() {
    var rows = [["Name", "Category", "Price", "Old price", "Stock", "Featured", "Image", "Description"]];
    data.products.forEach(function (p) { rows.push([p.name, p.category, p.price, p.oldPrice, p.stock, p.featured ? "yes" : "no", String(p.image).indexOf("data:") === 0 ? "(uploaded)" : p.image, p.desc]); });
    var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
    downloadFile("products.csv", "\ufeff" + csv, "text/csv");
  }
  function importCode() {
    var raw = root.querySelector("#rest").value.trim();
    if (!raw) { toast("আগে কোড paste করুন"); return; }
    raw = raw.replace(/^\s*var\s+PUBLISHED\s*=\s*/, "").replace(/;\s*$/, "");
    var o;
    try { o = JSON.parse(raw); } catch (e) { toast("কোডটি পড়া যায়নি — পুরোটা copy করেছেন তো?"); return; }
    if (!o || !Array.isArray(o.products) || !o.settings) { toast("এটি shop-এর কোড নয়"); return; }
    data = { settings: Object.assign({}, PUBLISHED.settings, o.settings), products: o.products };
    st.sel = {}; saveDraft(); renderAdmin(); toast("Restore হয়েছে");
  }

  function loginModal() {
    openModal('<h2>Admin login</h2><label class="fld"><span>Password</span><input id="lp" type="password"></label><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="login">Log in</button></div>');
  }
  function login() {
    if (modal.querySelector("#lp").value !== PUBLISHED.settings.adminPass) { toast("Password ভুল"); return; }
    isAdmin = true; jset(SS, ADM, true); data = loadDraft();
    st.view = "admin"; st.tab = "overview"; closeModal(); render();
  }
  function render() { if (st.view === "admin" && isAdmin) renderAdmin(); else { st.view = "shop"; renderShop(); } }

  /* ---------------- events ---------------- */
  root.addEventListener("click", function (e) {
    if (e.target === modal) { closeModal(); return; }
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.getAttribute("data-act"), id = b.getAttribute("data-id");
    if (a === "close") closeModal();
    else if (a === "yes") { var f = pending; pending = null; closeModal(); if (f) f(); }
    else if (a === "cat") { st.cat = b.getAttribute("data-c"); updGrid(); }
    else if (a === "shopnow") document.getElementById("bsProducts").scrollIntoView({ behavior: "smooth" });
    else if (a === "view") quickView(id);
    else if (a === "add") { var p = findP(id); if (addToCart(id, 1)) toast(p.name + " কার্টে যোগ হয়েছে"); }
    else if (a === "qvinc") { var q1 = findP(qv.id); if (qv.qty < q1.stock) qv.qty++; else toast("এর বেশি স্টকে নেই"); modal.querySelector("#qvq").textContent = qv.qty; }
    else if (a === "qvdec") { if (qv.qty > 1) qv.qty--; modal.querySelector("#qvq").textContent = qv.qty; }
    else if (a === "qvadd") { if (addToCart(qv.id, qv.qty)) { closeModal(); toast("কার্টে যোগ হয়েছে"); } }
    else if (a === "cart") cartModal();
    else if (a === "inc" || a === "dec") {
      var c = cart.filter(function (i) { return i.id === id; })[0], pp = findP(id);
      if (a === "inc") { if (c.qty < pp.stock) c.qty++; else toast("এর বেশি স্টকে নেই"); } else c.qty--;
      cart = cart.filter(function (i) { return i.qty > 0; }); saveCart(); updCnt(); cartModal();
    }
    else if (a === "checkout") checkoutModal();
    else if (a === "order") placeOrder();
    else if (a === "adminlogin") { if (isAdmin) { st.view = "admin"; render(); } else loginModal(); }
    else if (a === "login") login();
    else if (a === "logout") { isAdmin = false; jset(SS, ADM, false); data = PUBLISHED; st.view = "shop"; render(); }
    else if (a === "viewshop") { st.view = "shop"; renderShop(); }
    else if (a === "tab") { st.tab = b.getAttribute("data-t"); st.sel = {}; renderAdmin(); }
    else if (a === "new") productForm(null);
    else if (a === "edit") productForm(findP(id));
    else if (a === "dup") { var o = clone(findP(id)); o.id = uid(); o.name += " (copy)"; data.products.unshift(o); saveDraft(); renderAdmin(); toast("Copy তৈরি হয়েছে"); }
    else if (a === "saveprod") saveProduct(id);
    else if (a === "del") confirmBox("এই পণ্যটি মুছে ফেলবেন?", "Delete", function () { data.products = data.products.filter(function (p) { return p.id !== id; }); delete st.sel[id]; saveDraft(); renderAdmin(); toast("মুছে ফেলা হয়েছে"); });
    else if (a === "bfeat" || a === "bunfeat") { data.products.forEach(function (p) { if (st.sel[p.id]) p.featured = (a === "bfeat"); }); saveDraft(); renderAdmin(); toast("Updated"); }
    else if (a === "bdel") { var n = Object.keys(st.sel).length; confirmBox(n + " টি পণ্য মুছে ফেলবেন?", "Delete", function () { data.products = data.products.filter(function (p) { return !st.sel[p.id]; }); st.sel = {}; saveDraft(); renderAdmin(); toast("মুছে ফেলা হয়েছে"); }); }
    else if (a === "bcat") openModal('<h2>Category বদলান</h2><label class="fld"><span>নতুন category</span><input id="bCat" list="bsCats2"><datalist id="bsCats2">' + cats().map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + '</datalist></label><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="bcatsave">Apply</button></div>');
    else if (a === "bcatsave") { var nc = modal.querySelector("#bCat").value.trim(); if (!nc) { toast("Category-র নাম দিন"); return; } data.products.forEach(function (p) { if (st.sel[p.id]) p.category = nc; }); saveDraft(); closeModal(); renderAdmin(); toast("Updated"); }
    else if (a === "bclear") { st.sel = {}; updProducts(); }
    else if (a === "catren") { var oc = b.getAttribute("data-c"); openModal('<h2>Category-র নাম বদলান</h2><label class="fld"><span>নতুন নাম</span><input id="cName" value="' + esc(oc) + '"></label><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="catsave" data-c="' + esc(oc) + '">Save</button></div>'); }
    else if (a === "catsave") {
      var old = b.getAttribute("data-c"), nn = modal.querySelector("#cName").value.trim();
      if (!nn) { toast("নাম দিন"); return; }
      data.products.forEach(function (p) { if (p.category === old) p.category = nn; });
      if (st.af === old) st.af = "All";
      saveDraft(); closeModal(); renderAdmin(); toast("Saved");
    }
    else if (a === "catdel") {
      var dc = b.getAttribute("data-c");
      confirmBox('"' + dc + '" category মুছলে এর পণ্যগুলো "General"-এ যাবে। চালিয়ে যাবেন?', "Delete", function () { data.products.forEach(function (p) { if (p.category === dc) p.category = "General"; }); if (st.af === dc) st.af = "All"; saveDraft(); renderAdmin(); toast("মুছে ফেলা হয়েছে"); });
    }
    else if (a === "savesettings") saveSettings();
    else if (a === "csv") exportCsv();
    else if (a === "dlbackup") downloadFile("shop-backup.json", "var PUBLISHED = " + JSON.stringify(data, null, 1) + ";", "application/json");
    else if (a === "copy") { var ta = root.querySelector("#pubCode"); ta.select(); try { document.execCommand("copy"); toast("Copied"); } catch (x) { toast("Ctrl+C দিয়ে copy করুন"); } }
    else if (a === "restore") confirmBox("বর্তমান draft-এর সব পণ্য ও settings paste করা কোড দিয়ে বদলে যাবে।", "Restore", importCode);
    else if (a === "reset") confirmBox("Draft মুছে published version-এ ফিরবেন? আপনার unpublished পরিবর্তন হারিয়ে যাবে।", "Discard", function () { try { LS.removeItem(DRAFT); } catch (x) {} data = loadDraft(); st.sel = {}; renderAdmin(); toast("Draft মুছে গেছে"); });
  });
  root.addEventListener("input", function (e) {
    if (e.target.id === "bsQ") { st.q = e.target.value; updGrid(); }
    else if (e.target.id === "aQ") { st.aq = e.target.value; updProducts(); }
  });
  root.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "bsSort") { st.sort = t.value; updGrid(); }
    else if (t.name === "area" || t.name === "pay") updSummary();
    else if (t.id === "aCat") { st.af = t.value; updProducts(); }
    else if (t.id === "aStock") { st.as = t.value; updProducts(); }
    else if (t.id === "aSort") { st.asort = t.value; updProducts(); }

    else if (t.classList && t.classList.contains("rowchk")) {
      var pid = t.getAttribute("data-id"); if (t.checked) st.sel[pid] = true; else delete st.sel[pid];
      var tr = t.closest("tr"); if (tr) tr.className = t.checked ? "sel" : "";
      document.getElementById("aBulk").innerHTML = bulkHtml(); syncAll();
    }
    else if (t.classList && t.classList.contains("stk")) {
      var p = findP(t.getAttribute("data-id")); if (!p) return;
      p.stock = Math.max(0, parseInt(t.value, 10) || 0); saveDraft(); renderAdmin(); toast("Stock updated");
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modal.hidden) closeModal();
    if (e.key === "Enter" && !modal.hidden && modal.querySelector("#lp")) login();
  });

  render();
})();
